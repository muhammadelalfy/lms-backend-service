name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ai_image:
        description: "AI service image to roll out (default: the latest published one)"
        required: false
        default: ghcr.io/muhammadelalfy/lms-ai-service:latest

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, zip, openssl, intl, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-dev --abandoned=ignore

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          printf '\nDB_CONNECTION=sqlite\nDB_DATABASE=%s\n' "$PWD/database/database.sqlite" >> .env

      - name: Run PHP syntax checks
        run: find app Modules tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Laravel migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test --compact

  image:
    name: API image + stack smoke test
    needs: laravel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mudarisy-api
    defaults:
      run:
        working-directory: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint deploy scripts
        run: shellcheck -S warning deploy.sh smoke-test.sh make-env.sh make-certs.sh install-origin-cert.sh update-cloudflare-ips.sh

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack (3 API replicas behind the load balancer)
        run: |
          cp compose.env.example .env
          sed -i -e "s|^API_IMAGE=.*|API_IMAGE=$IMAGE:${{ github.sha }}|" -e "s|^WEB_IMAGE=.*|WEB_IMAGE=nginx:1.28-alpine|" \
                 -e "s|^SMOKE_SCHOOL_HOST=.*|SMOKE_SCHOOL_HOST=ci.mudarisy.localhost|" .env
          ./make-env.sh "$IMAGE:${{ github.sha }}" api.mudarisy.localhost mudarisy.localhost
          docker compose up -d --wait

      - name: Smoke test through the load balancer
        env:
          SMOKE_SKIP_WEB: "1"
          SMOKE_TLS_URL: https://localhost
          SMOKE_LOGIN_EMAIL: owner@ci.test
          SMOKE_LOGIN_PASSWORD: CiSmoke!2026pass
        run: |
          docker compose exec -T api php artisan school:create ci --name=CI --plan=pro \
            --admin-email="$SMOKE_LOGIN_EMAIL" --admin-password="$SMOKE_LOGIN_PASSWORD"
          ./smoke-test.sh http://localhost api.mudarisy.localhost ci.mudarisy.localhost

      - name: Zero-downtime rollout with deploy.sh (two rollouts via a local registry)
        env:
          SMOKE_SKIP_WEB: "1"
        run: |
          docker run -d --name registry -p 127.0.0.1:5001:5000 registry:2
          for tag in rollout-a rollout-b; do
            docker tag "$IMAGE:${{ github.sha }}" "localhost:5001/mudarisy-api:$tag"
            docker push -q "localhost:5001/mudarisy-api:$tag"
          done
          ./deploy.sh API_IMAGE localhost:5001/mudarisy-api:rollout-a
          ./deploy.sh API_IMAGE localhost:5001/mudarisy-api:rollout-b
          test "$(docker compose ps -q api | wc -l)" -eq 3
          grep -qx 'server api:8000 resolve max_fails=3 fail_timeout=10s;' nginx/upstreams/api.inc

      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest" && docker push "$IMAGE:latest"

  deploy:
    name: Deploy to production
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload stack definition
        run: |
          scp -r deploy/{docker-compose.yml,deploy.sh,deploy-ai.sh,make-ai-env.sh,smoke-test.sh,make-certs.sh,install-origin-cert.sh,nginx} \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/mudarisy/"

      - name: Roll out the new image
        run: |
          target="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$target" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          status=0
          ssh "$target" "/opt/mudarisy/deploy.sh API_IMAGE ghcr.io/${{ github.repository_owner }}/mudarisy-api:${{ github.sha }}" || status=$?
          ssh "$target" "docker logout ghcr.io" || true
          exit $status

  deploy-ai:
    name: Deploy AI service
    # Run it by hand: Actions > CI > Run workflow (branch main). The AI service is deployed apart
    # from the API so that its release never blocks, or is blocked by, the platform's.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload stack definition
        run: |
          scp -r deploy/{docker-compose.yml,deploy-ai.sh,make-ai-env.sh} \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/mudarisy/"

      - name: Roll out the AI service
        run: |
          target="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$target" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          status=0
          ssh "$target" "/opt/mudarisy/deploy-ai.sh '${{ inputs.ai_image }}'" || status=$?
          ssh "$target" "docker logout ghcr.io" || true
          exit $status
