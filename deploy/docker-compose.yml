# Single-host production stack: nginx load balancer -> N stateless API replicas.
#
#   cp .env.production.example .env.production   # fill in secrets
#   cp compose.env.example .env                  # image tags, domains, replica count
#   docker compose up -d --wait
#
# Data is SQLite (central + one file per school) on the shared `db` volume. That
# keeps every replica on one host; spreading across hosts needs PostgreSQL first
# (constitution §9: decide the tenancy mapping in an ADR before migrating).
name: mudarisy

x-app: &app
  image: ${API_IMAGE:-mudarisy-api:local}
  env_file: [.env.production]
  restart: unless-stopped
  volumes:
    - db:/app/database
    - storage:/app/storage
  depends_on:
    init: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  init:
    image: ${API_IMAGE:-mudarisy-api:local}
    env_file: [.env.production]
    entrypoint: ["mudarisy-init"]
    restart: "no"
    volumes:
      - db:/app/database
      - storage:/app/storage
    depends_on:
      redis: { condition: service_healthy }
    logging: *logging

  api:
    <<: *app
    deploy:
      replicas: ${API_REPLICAS:-3}
      resources: { limits: { memory: 384m } }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    deploy: { resources: { limits: { memory: 192m } } }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=critical,chat,default,whatsapp,sms,low",
              "--sleep=1", "--tries=3", "--timeout=60", "--max-time=3600"]
    stop_grace_period: 70s
    deploy: { resources: { limits: { memory: 256m } } }
    healthcheck: { test: ["CMD-SHELL", "kill -0 1"], interval: 30s }

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    deploy: { resources: { limits: { memory: 192m } } }
    healthcheck: { test: ["CMD-SHELL", "kill -0 1"], interval: 30s }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # --- AI service (optional: `docker compose --profile ai ...`; rolled out by deploy-ai.sh) -------
  # Internal only: no ports are published; Laravel reaches it at http://lms-ai:8001.
  lms-ai:
    profiles: [ai]
    image: ${AI_IMAGE:-ghcr.io/muhammadelalfy/lms-ai-service:latest}
    env_file: [.env.ai]
    restart: unless-stopped
    expose: ["8001"]
    deploy: { resources: { limits: { memory: 512m } } }
    depends_on:
      ai-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  ai-db:
    profiles: [ai]
    image: pgvector/pgvector:pg16
    env_file: [.env.ai]
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    deploy: { resources: { limits: { memory: 384m } } }
    volumes: [ai-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  # Runs the AI jobs (material extraction/ingest) apart from the normal queues: they are slow.
  ai-worker:
    <<: *app
    profiles: [ai]
    command: ["php", "artisan", "queue:work", "redis", "--queue=ai", "--sleep=2", "--tries=3", "--timeout=170", "--max-time=3600"]
    stop_grace_period: 180s
    deploy: { resources: { limits: { memory: 256m } } }
    healthcheck: { test: ["CMD-SHELL", "kill -0 1"], interval: 30s }

  web:
    image: ${WEB_IMAGE:-mudarisy-web:local}
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64m } } }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  lb:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      CENTRAL_HOST: ${CENTRAL_HOST:?set CENTRAL_HOST in .env}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-root.invalid}
    # A directory mount, not per-file: a file replaced on the host (new inode) would
    # otherwise stay invisible to the container. deploy.sh re-renders and reloads it.
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
      reverb: { condition: service_started }
    logging: *logging

volumes:
  db: {}
  storage: {}
  redis: {}
  ai-db: {}
